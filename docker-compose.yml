version: '3.8'
services:
  postgres:
    image: postgres:15
    restart: always
    environment:
      - POSTGRES_USER=Gun
      - POSTGRES_PASSWORD=Test1234
      - POSTGRES_DB=mydb
    ports:
      - '5432:5432'
    volumes: 
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: