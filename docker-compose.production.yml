name: lightrag-directory

services:
  app:
    container_name: lightrag_directory_app
    image: ${REGISTRY_PATH}/${IMAGE_NAME}:${IMAGE_VERSION}
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    volumes:
      - ./uploads:/app/uploads
