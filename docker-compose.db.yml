name: lightrag-directory

services:
  db:
    image: postgres:17.6
    container_name: lightrag_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-lightrag}
    volumes:
      - postgre_data:/var/lib/postgresql/data
    ports:
        - "5470:5432"
    networks:
      - postgres_network

volumes:
  postgre_data:

networks:
  postgres_network:
    driver: bridge
