# Production Docker Compose Configuration
# Usage: docker compose -f docker-compose.prod.yml up -d

name: lightrag-directory

services:
  db:
    image: postgres:16-alpine
    container_name: lightrag_postgres_prod
    restart: always
    environment:
      # Override these in production .env or via environment variables
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  redis:
    image: redis:alpine
    container_name: lightrag_redis_prod
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - app_network

  app:
    container_name: lightrag_app_prod
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "80:3000"      # Map port 80 to container port 3000
      - "8001:8001"    # OCR service
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - OCR_MODE=${OCR_MODE:-api}
      - TYPHOON_API_KEY=${TYPHOON_API_KEY}
      - TYPHOON_API_URL=${TYPHOON_API_URL:-https://api.opentyphoon.ai/v1/ocr}
      - TYPHOON_MODEL=${TYPHOON_MODEL:-typhoon-ocr}
      - OCR_SERVICE_URL=http://localhost:8001
    volumes:
      - ./uploads:/app/uploads
      - ./markdown:/app/markdown
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  app_network:
    driver: bridge
